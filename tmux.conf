unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# niceties
set -g mouse on
set -g set-clipboard on 

# set-window-option -g window-status-current-format " #I:#{b:pane_current_path}#F"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"

# status line
# set -g status-style bg=default fg=#8a8a8a
set -g status-style "bg=default fg=#888888"
set -g status-justify centre
set -g status-position top
set-window-option -g window-status-format " #I:#{b:pane_current_path}"
set -g window-status-style  fg=#888888
set-window-option -g window-status-current-format " #I:#{b:pane_current_path}"
set-window-option -g window-status-current-style "fg=red, bold"
set -g status-interval 2
set -g status-left "#{pane_current_command} "
# set -g status-left '#[fg=blue, bold] #(TZ="America/New_York" date +"%%H:%%M")'
set -g status-right "#S "


unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set -g prefix2 C-space
# bind C-space send-prefix

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# setw -g mode-keys vi
# # Start copy mode with `v`
# bind-key -T copy-mode-vi v send-keys -X begin-selection
# # Use wl-copy to copy to system clipboard
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

bind - split-window -v

# split current window vertically
bind h select-pane -L # move left
bind j select-pane -D # move down
bind k select-pane -U # move up
bind l select-pane -R # move right
bind > swap-pane -D      # swap current pane with the next one
bind < swap-pane -U      # swap current pane with the previous one

# pane resizing 
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2


set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-auto-save 'on'

run ~/.tmux/plugins/tpm/tpm
